<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Francotti HUD</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">

<!-- iPhone "Add to Home Screen" – standalone fullscreen app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HUD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=1">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="icon-180.png?v=1">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=1">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=1">

<!-- Cache-busting: iPhone Safari is aggressive; meta tags + build stamp -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="build" content="2026-08-02-0123">

<style>
  /* ================= Base — same vintage-instrument look as Jaeger ================= */
  html,body{margin:0;height:100%;}
  body{
    min-height:100vh;
    font-family:"Helvetica Neue","Arial",sans-serif;
    color:#ddd;
    background-color:#0a0a0a;
    background-image:
      radial-gradient(ellipse at 50% 0%,  rgba(50,50,50,.45), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.80), transparent 60%);
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    max-width:1100px;margin:0 auto;padding:20px 12px 28px;
    display:flex;flex-direction:column;gap:20px;align-items:center;
    background:#050505;
    border-radius:6px;
    box-shadow:inset 0 0 40px rgba(0,0,0,.9);
  }
  header{
    text-align:center;letter-spacing:.32em;font-size:11px;color:#a9a9a9;
    transition:opacity .8s ease, visibility .8s ease;
  }
  header .title{font-size:14px;letter-spacing:.42em;color:#c8b880;}
  body.header-hidden header{opacity:0;visibility:hidden;pointer-events:none;}
  @media (display-mode: standalone), (display-mode: fullscreen){ header{display:none;} }
  body.ios-standalone header{display:none;}
  @supports (padding: max(0px)){
    body{ padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  }

  /* Speedometer truly in the middle: compass (top) + frost (bottom)
     stacked on the LEFT, speedo in its own centre column spanning both
     rows, speedlimit (top) + signal-quality telltale (bottom) on the
     RIGHT. Same arrangement on both Scherm 1 and Scherm 2, portrait and
     landscape. .small-dials stays display:contents (an invisible
     wrapper) so compass/limit/limit2/frost/signal become direct grid
     items of .cluster itself, addressable by explicit grid-area. Only
     one of limit/limit2 is ever visible (display:none on the other) but
     both share the same "limit" area, so whichever is shown lands in
     the top-right. --sg (speedo diameter) and --sm (small-dial diameter)
     are sized with vh/vw so it fills the screen edge-to-edge on any
     phone/orientation, not one fixed breakpoint. */
  .wrap{ --sg: min(80vh, 42vw); --sm: calc(var(--sg)/2 - 5px); }
  .cluster{
    display:grid;
    grid-template-columns: var(--sm) var(--sg) var(--sm);
    grid-template-rows: var(--sm) var(--sm);
    grid-template-areas:
      "compass speedo limit"
      "frost   speedo signal";
    align-items:center; justify-content:center;
    gap:10px 3vw;
    width:100%;
  }
  .small-dials{ display:contents; }
  #speedGauge{ grid-area: speedo; }
  #compassGauge{ grid-area: compass; }
  #limitGauge, #limitGauge2{ grid-area: limit; }
  #frostGauge{ grid-area: frost; }
  #signalGauge{ grid-area: signal; }
  .gauge{ width:var(--sg); height:var(--sg); position:relative; }
  .gauge svg{width:100%;height:100%;display:block;}
  .gauge.gauge-med{ width:var(--sm); height:var(--sm); }

  /* "SCHERM 4" — standalone preview of the two navigation dials (see
     #navGauge / #mapGauge markup): hides the normal cluster and shows
     just these two, side by side, so they can be reviewed on their own
     before deciding where they live permanently among the other gauges. */
  #navGauge, #mapGauge{ display:none; }
  body.mode-screen4 #speedGauge,
  body.mode-screen4 .small-dials{ display:none; }
  body.mode-screen4 .cluster{
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
    grid-template-areas: "nav mapdial";
  }
  body.mode-screen4 #navGauge,
  body.mode-screen4 #mapGauge{
    display:block;
    width:min(44vh,44vw);
    height:min(44vh,44vw);
  }
  body.mode-screen4 #navGauge{ grid-area: nav; justify-self:end; }
  body.mode-screen4 #mapGauge{ grid-area: mapdial; justify-self:start; }

  /* Phone landscape: more usable height than width, so --sg leans on vh
     harder, plus the safe-area padding/header-hide/footer-collapse needed
     to actually fill a short landscape viewport edge-to-edge. */
  @media (orientation:landscape) and (max-height:500px){
    .wrap{
      --sg: min(90vh, 46vw);
      padding: max(4px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
               max(4px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      gap:4px;
      min-height:100vh; min-height:100dvh;
      justify-content:center;
    }
    header{ display:none; }
    /* Footer normally just fades out (visibility:hidden) but still
       reserves layout height — collapse it once hidden so the cluster
       can actually claim the freed-up vertical space and fill the screen. */
    body.footer-hidden footer{ max-height:0;margin:0;overflow:hidden; }
  }

  /* Phone portrait: rearrange into 3 rows so every dial fills the screen
     edge-to-edge instead of leaving the top/bottom margins the landscape
     layout's 2-row grid would leave in portrait — signal top-left,
     speedlimit top-right, speedo centered full-width in the middle,
     frost bottom-left, compass bottom-right. Same header/footer-hiding
     and safe-area handling as the landscape block above so the cluster
     can actually claim the full viewport height. */
  @media (orientation:portrait){
    .wrap{
      --sm: min(44vw, 24vh);
      --sg: min(94vw, 46vh);
      padding: max(4px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right))
               max(4px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
      gap:4px;
      min-height:100vh; min-height:100dvh;
      justify-content:center;
    }
    header{ display:none; }
    body.footer-hidden footer{ max-height:0;margin:0;overflow:hidden; }
    .cluster{
      grid-template-columns: 1fr 1fr;
      grid-template-rows: var(--sm) var(--sg) var(--sm);
      grid-template-areas:
        "signal  limit"
        "speedo  speedo"
        "frost   compass";
      gap:8px 4vw;
    }
    #signalGauge{ justify-self:start; }
    #limitGauge, #limitGauge2{ justify-self:end; }
    #speedGauge{ justify-self:center; }
    #frostGauge{ justify-self:start; }
    #compassGauge{ justify-self:end; }
  }

  /* "SCHERM 2" — a second, hub-mirror-mount source variant on the same
     page: same speed/compass/frost dials, but the plain speed-limit sign
     copy (#limitGauge2, no logo/dark bezel) instead of the dressed-up
     original (#limitGauge, has the Jaeger logo + dark-red bezel). Default
     (screen 1) shows the original and hides the plain copy; toggling
     swaps which one is visible. */
  #limitGauge2{ display:none; }
  body.mode-screen2 #limitGauge{ display:none; }
  body.mode-screen2 #limitGauge2{ display:block; }

  /* Scherm 2's speedometer: the tick scale + needle are swapped for one
     big digital number. Ring (speed-bezel-glow), background/wave-band
     glow, wave band itself and the Jaeger logo are untouched. */
  #speedBigDigits{ display:none; }
  body.mode-screen2 #speedTicks,
  body.mode-screen2 #speedNumerals,
  body.mode-screen2 #speedNeedle,
  body.mode-screen2 #speedUnitLabel,
  body.mode-screen2 #speedMicroPrint,
  body.mode-screen2 #speedWarnDigits{ display:none; }
  body.mode-screen2 #speedBigDigits{ display:block; }

  /* Scherm 2's frost gauge: drop the °C unit, thermometer icon, snowflake
     and sun telltales — just the (now much bigger, recentered) number. */
  body.mode-screen2 #frostUnit,
  body.mode-screen2 #frostThermoIcon,
  body.mode-screen2 #frostIcon,
  body.mode-screen2 #heatIcon{ display:none; }

  /* Scherm 2's compass: drop the wave band, the fixed pointer needle and
     the rotating letter/tick card — replaced by one wide blue arrow
     (inside #compassFace, same rotation) that always points north. */
  #compassNorthArrow{ display:none; }
  body.mode-screen2 #compassLouver,
  body.mode-screen2 #compassArrow,
  body.mode-screen2 #windTicks,
  body.mode-screen2 #windLetters,
  body.mode-screen2 #compassMiniRose,
  body.mode-screen2 #compassLogo{ display:none; }
  body.mode-screen2 #compassNorthArrow{ display:block; }

  /* "SCHERM 3" — built on Scherm 2's dials (big digital speedo, blue
     north-arrow compass, big frost digits, white-face limit sign — see
     setScreen3() below, which forces mode-screen2 on too), with these
     extra tweaks on top: hide any chrome ring that is always neutral
     silver/chrome (speed/compass/frost/signal), but leave the
     speed-limit sign's ring alone — its ring IS the coloured state
     (red=known limit, amber=unknown, blue=no limit), so it stays
     visible. Also hide every wave/louvre "washboard" band and every
     Jaeger nameplate logo, on all dials. */
  body.mode-screen3 #speedBezelRing,
  body.mode-screen3 #compassBezelRing,
  body.mode-screen3 #frostBezelRing,
  body.mode-screen3 #signalBezelRing{ display:none; }
  body.mode-screen3 #speedLouver,
  body.mode-screen3 #compassLouver,
  body.mode-screen3 #limitLouver,
  body.mode-screen3 #frostLouver,
  body.mode-screen3 #signalLouver{ display:none; }
  body.mode-screen3 #speedLogo,
  body.mode-screen3 #compassLogo,
  body.mode-screen3 #limitLogo,
  body.mode-screen3 #frostLogo,
  body.mode-screen3 #signalLogo{ display:none; }
  /* Also drop the original black dial face + its "shadow ring" arc
     pairs (the layered sunken-dial look) on the same four gauges — the
     page background behind is already the same near-black (#0a0a0a), so
     ticks/needle/numerals/digits are left floating on it cleanly. The
     speed gauge's extra vignette overlay (drawn after the ticks) goes
     with it; the limit sign's face is left alone, same reasoning as
     its ring above. */
  body.mode-screen3 #speedFaceRings,
  body.mode-screen3 #speedInnerShadow,
  body.mode-screen3 #compassFaceRings,
  body.mode-screen3 #frostFaceRings,
  body.mode-screen3 #signalFaceRings{ display:none; }

  /* Big digit's glow tier (5-30 km/h over the limit) — bright red, same
     slower 3.6s pulse as before ("slowly" per the original request). */
  .speed-big-digit-glow{ opacity:0; pointer-events:none; }
  #speedBigDigits.red-glow .speed-big-digit-glow{ animation: pulseGlow 3.6s ease-in-out infinite; }

  /* Mirror mode — for mounting the phone in a windshield HUD reflector
     (a glass/mirror combiner): flips the whole dial cluster horizontally,
     including all digits, so the mirror's reflection reads correctly to
     the driver. Manual toggle, off by default — footer buttons still
     need to be tapped in their true (unflipped) screen position when
     mirror is on, since the transform flips their visuals too. */
  body.mirror-on .wrap{ transform:scaleX(-1); }

  .needle{
    transform-box:view-box;
    transform-origin:200px 271px;transform:rotate(0deg);
    /* Faster needle response (was .5s) — the old easing made speed
       changes visibly lag behind the actual GPS value. */
    transition:transform .25s cubic-bezier(.22,1,.3,1);
  }
  #compassFace{
    transform-box:view-box;
    transform-origin:200px 200px;
    transform:rotate(0deg);
    transition:transform .35s ease-out;
  }

  /* Pulse glows — same mechanism as Jaeger (SVG feGaussianBlur, not CSS
     filter on <g>, because CSS filter on SVG groups is unreliable on iOS). */
  @keyframes pulseGlow { 0%,100% { opacity:0; } 50% { opacity:.85; } }
  /* needle-red-glow's pulse is driven directly from JS (see
     setSpeedGlowState / speedGlowTick below), not a CSS animation — two
     independent CSS animations on different elements can drift apart
     over time even when started on the same frame, so the needle and
     ring red pulse now read the exact same JS-computed opacity value
     every frame, making drift structurally impossible. */
  .needle-red-glow{opacity:0;pointer-events:none;}

  /* Scherm 1's live speed-digit readout: bright red pulsing glow layer,
     5-30 km/h over the limit — same red family as the needle glow. */
  .speed-warn-digit-glow{ opacity:0; pointer-events:none; }
  #speedWarnDigits.red-warn .speed-warn-digit-glow{ animation: pulseGlow 2.8s ease-in-out infinite; }

  /* Map dial's speed readout (hand-drawn GLYPH digits, same as every
     other dial): bright yellow pulsing glow 0-5 km/h over the current
     limit, bright red pulsing glow >=5 over — same thresholds/colours
     as the main speedometer's warn tiers. */
  .map-speed-glow-yellow, .map-speed-glow-red{ opacity:0; pointer-events:none; }
  #mapSpeedDigits.yellow-glow .map-speed-glow-yellow{ animation: pulseGlow 2.8s ease-in-out infinite; }
  #mapSpeedDigits.red-glow .map-speed-glow-red{ animation: pulseGlow 2.8s ease-in-out infinite; }

  /* Speed-vs-limit escalation, same colours as the Jaeger temp needle's
     hot/red tiers: <5 km/h over = orange (chrome ring + needle), >=5 = red
     (chrome ring + needle), >30 over = whole background + wave band red
     + siren. */
  .needle-hot-glow{opacity:0;pointer-events:none;}
  .needle.hot-warn .needle-hot-glow{ animation: pulseGlow 2.8s ease-in-out infinite; }
  .speed-bezel-glow-hot, .speed-bezel-glow-red{opacity:0;pointer-events:none;}
  .speed-bezel-glow.hot-warn .speed-bezel-glow-hot{ animation: pulseGlow 2.8s ease-in-out infinite; }
  /* Background + wave-band glow are also driven from the same shared JS
     clock as the needle/ring (see setSpeedGlowState below), so the
     whole extreme-tier escalation — ring, background, wave band —
     pulses in the exact same rhythm as the needle. */
  .speed-bg-glow-red, .speed-louver-glow-red{opacity:0;pointer-events:none;}

  .frost-glow, .heat-glow{opacity:0;pointer-events:none;}
  .frost-icon.frost-warn .frost-glow{ animation: pulseGlow 3s ease-in-out infinite; }

  /* Chrome rim + digit glow — same 3 tiers/colours as the Jaeger temp
     needle (cold <3°C blue, hot >25°C orange, red >30°C red). */
  .frost-bezel-glow-cold, .frost-bezel-glow-hot, .frost-bezel-glow-red,
  .frost-digit-glow-cold, .frost-digit-glow-hot, .frost-digit-glow-red{opacity:0;pointer-events:none;}
  .frost-bezel-glow.cold-warn .frost-bezel-glow-cold,
  .frost-digits.cold-warn .frost-digit-glow-cold{ animation: pulseGlow 3s ease-in-out infinite; }
  .frost-bezel-glow.hot-warn .frost-bezel-glow-hot,
  .frost-digits.hot-warn .frost-digit-glow-hot{ animation: pulseGlow 3s ease-in-out infinite; }
  .frost-bezel-glow.red-warn .frost-bezel-glow-red,
  .frost-digits.red-warn .frost-digit-glow-red{ animation: pulseGlow 3s ease-in-out infinite; }

  footer{
    margin-top:4px;font-size:11px;letter-spacing:.28em;
    color:#7a7a7a;text-align:center;
    transition:opacity .8s ease, visibility .8s ease;
  }
  /* Auto-hides 3s after load so the dials fill the screen (real
     Fullscreen API isn't available on iOS Safari) — tap anywhere to
     bring the controls back. */
  body.footer-hidden footer{opacity:0;visibility:hidden;pointer-events:none;}
  footer .status{color:#c8b880;}
  footer .err{color:#c86a5a;}
  .loc-row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  #locMode{color:#c8b880;font-size:10px;letter-spacing:.32em;}
  #locMode .tag{color:#7a7a7a;}
  .btn-vintage{
    background:#141414;color:#c8b880;
    border:1px solid #3a3a3a;border-radius:3px;
    padding:5px 14px;
    font:10px/1 "Helvetica Neue","Arial",sans-serif;
    letter-spacing:.32em;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-vintage:active,.btn-vintage:hover{background:#1f1f1f;border-color:#5a5a5a;color:#e8dcb0;}
  .btn-small{padding:4px 8px;font-size:9px;}
  .compass-offset-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:8px;}
  .compass-calib-touch{ cursor:pointer; }
  .compass-calib-touch:active path{ stroke: #ffd83d !important; }
  .build-stamp{margin-top:10px;font-size:8px;letter-spacing:.42em;color:#3f3f3f;}

  .compass-hint{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:5; opacity:1;
    transition: opacity .45s ease-out;
  }
  .compass-hint.dim{ opacity:0; }
  .compass-hint-text{
    font:10px/1 "Helvetica Neue","Arial",sans-serif;
    letter-spacing:.34em; color:#c8b880; text-transform:uppercase;
    padding:10px 16px; border:1px solid #5a4d2e; border-radius:3px;
    background:rgba(8,8,8,0.85);
    animation: compassHintPulse 1.6s ease-in-out infinite;
  }
  @keyframes compassHintPulse{ 0%,100% { opacity:.6; } 50% { opacity:1; } }

  /* Yellow "activate compass" action button, overlaid on the compass
     dial — only shown while iOS's device-orientation permission still
     needs a real tap to grant. Sized to match the dial exactly (100% of
     the .gauge box, which is itself sized responsively via --sm/--sg),
     not a fixed pixel size, so it always covers the whole dial. */
  .compass-permit-btn{
    display:none;
    position:absolute; inset:0;
    width:100%; height:100%; border-radius:50%;
    background:#f2c53d; border:2px solid #8a6a10;
    align-items:center; justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.55);
    cursor:pointer; -webkit-tap-highlight-color:transparent;
    z-index:6; padding:0;
    animation: compassPermitPulse 1.7s ease-in-out infinite;
  }
  .compass-permit-btn svg{ width:35%; height:35%; }
  .compass-permit-btn.show{ display:flex; }
  @keyframes compassPermitPulse{
    0%,100% { box-shadow:0 0 0 0 rgba(242,197,61,.55), 0 2px 10px rgba(0,0,0,.55); }
    50%     { box-shadow:0 0 0 9px rgba(242,197,61,0), 0 2px 10px rgba(0,0,0,.55); }
  }

  /* ---- Nav panel ---- */
  .nav-panel{
    display:flex; flex-direction:column; gap:8px; align-items:center;
    width:100%; max-width:480px; margin-top:4px;
  }
  .nav-row{display:flex; gap:8px; width:100%; justify-content:center; flex-wrap:wrap;}
  #navDest{
    background:#141414;color:#e8dcb0;border:1px solid #3a3a3a;border-radius:3px;
    padding:6px 10px;font:11px/1 "Helvetica Neue","Arial",sans-serif;letter-spacing:.08em;
    min-width:200px;
  }
  .nav-instruction{
    color:#c8b880; font-size:12px; letter-spacing:.12em; text-align:center;
    min-height:1.4em;
  }
  .nav-sub{ color:#7a7a7a; font-size:10px; letter-spacing:.2em; }

  .awake-tag{ margin-top:4px;font-size:8px;letter-spacing:.42em; color:#3f3f3f;text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">FRANCOTTI · HUD</div>
    <div style="margin-top:6px">SNELHEID · LIMIET · NAVIGATIE</div>
  </header>

  <div class="cluster">
    <!-- ============ SPEED DIAL (primary) ============ -->
    <div class="gauge" id="speedGauge">
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bezelChromeS" cx="50%" cy="50%" r="50%">
            <stop offset="76%"  stop-color="#000000"/>
            <stop offset="79%"  stop-color="#222226"/>
            <stop offset="81%"  stop-color="#c8cfd6"/>
            <stop offset="83%"  stop-color="#fbfcfe"/>
            <stop offset="85%"  stop-color="#5a6066"/>
            <stop offset="87%"  stop-color="#eef2f5"/>
            <stop offset="89%"  stop-color="#3a4048"/>
            <stop offset="91%"  stop-color="#fafbfd"/>
            <stop offset="93%"  stop-color="#7e8690"/>
            <stop offset="96%"  stop-color="#edf1f4"/>
            <stop offset="98%"  stop-color="#23262a"/>
            <stop offset="100%" stop-color="#050508"/>
          </radialGradient>
          <linearGradient id="bezelSheenS" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="rgba(248,252,255,.62)"/>
            <stop offset="32%"  stop-color="rgba(248,252,255,.06)"/>
            <stop offset="48%"  stop-color="rgba(0,0,0,.20)"/>
            <stop offset="52%"  stop-color="rgba(0,0,0,.42)"/>
            <stop offset="72%"  stop-color="rgba(180,190,200,.08)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,.72)"/>
          </linearGradient>
          <radialGradient id="faceS" cx="50%" cy="45%" r="60%">
            <stop offset="0%"   stop-color="#151515"/>
            <stop offset="55%"  stop-color="#0c0c0c"/>
            <stop offset="100%" stop-color="#030303"/>
          </radialGradient>
          <radialGradient id="innerBezelS" cx="200" cy="200" r="142" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#2e2e2e"/>
            <stop offset="90%"  stop-color="#2a2a2a"/>
            <stop offset="100%" stop-color="#1b1b1b"/>
          </radialGradient>
          <linearGradient id="innerBezelSheenS" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%"   stop-color="rgba(255,255,255,.07)"/>
            <stop offset="55%"  stop-color="rgba(255,255,255,0)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,.28)"/>
          </linearGradient>
          <mask id="innerBezelRingS">
            <rect width="400" height="400" fill="black"/>
            <circle cx="200" cy="200" r="142" fill="white"/>
            <circle cx="200" cy="200" r="132" fill="black"/>
          </mask>
          <radialGradient id="deepFaceS" cx="50%" cy="40%" r="60%">
            <stop offset="0%"   stop-color="#252525"/>
            <stop offset="55%"  stop-color="#1f1f1f"/>
            <stop offset="100%" stop-color="#1a1a1a"/>
          </radialGradient>
          <mask id="bezelRingS">
            <rect width="400" height="400" fill="black"/>
            <circle cx="200" cy="200" r="196" fill="white"/>

<script>
const svgNS = "http://www.w3.org/2000/svg";
const CX = 200, CY = 200;
function el(tag, attrs = {}, text) {
  const n = document.createElementNS(svgNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}
function polar(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

if (window.navigator.standalone === true) document.body.classList.add("ios-standalone");

/* =====================================================================
   SPEED DIAL  — 0/50/100/150/200 km/h, same flat-baseline numeral
   layout & piecewise angle mapping as the Jaeger temperature dial.
===================================================================== */
const SPEED_MARKS = [0, 50, 100, 150, 200];
// "0" is aligned exactly under the lower end of its own tick mark
// (tickX[0]) per request, instead of the old custom-offset 124.
const numX  = [132, 166, 200, 238, 276];
const tickX = [132, 166, 200, 234, 268];
const numY  = 156;
const fanOX = 200, fanOY = 236;
const tickBottomY = 138;
const tickLen = 38;
const S_ANCHOR_DEG = tickX.map(x => Math.atan2(x - 200, 271 - 138) * 180 / Math.PI);

function speedAngle(v) {
  const vals = SPEED_MARKS, degs = S_ANCHOR_DEG;
  let i;
  if (v <= vals[0]) i = 0;
  else if (v >= vals[vals.length - 1]) i = vals.length - 2;
  else { i = 0; while (v > vals[i + 1]) i++; }
  const f = (v - vals[i]) / (vals[i + 1] - vals[i]);
  return degs[i] + f * (degs[i + 1] - degs[i]);
}

// Gauge-photo-traced digit set — kept here unused/saved per request, in
// case we want to switch to it later. Not referenced anywhere below.
const GLYPH_GAUGE = {
  '-': 'M -2.6 0 L 2.6 0',
  '0': 'M -2.0 -6.4 L -2.0 6.4 A 2.0 2.0 0 0 0 2.0 6.4 L 2.0 -6.4 A 2.0 2.0 0 0 0 -2.0 -6.4 Z',
  '1': 'M -1.4 -5.4 L 0 -8.4 L 0 8.4',
  '2': 'M -2.5 -5.0 Q -2.5 -8.4 0.2 -8.4 Q 2.6 -8.4 2.6 -5.6 Q 2.6 -2.6 1.0 -0.8 L -2.6 5.6 L -2.6 8.4 L 2.6 8.4',
  '3': 'M -2.0 -6.0 Q -2.0 -8.4 0.4 -8.4 Q 2.7 -8.4 2.7 -5.8 Q 2.7 -3.4 0.2 -2.8 Q 2.7 -2.2 2.7 0.4 L 2.7 5.8 Q 2.7 8.4 0.4 8.4 Q -2.0 8.4 -2.0 6.0',
  '4': 'M 1.3 8.4 L 1.3 -8.4 L -2.6 3.6 L 2.6 3.6',
  '5': 'M 2.6 -8.4 L -2.6 -8.4 L -2.6 0.4 Q 2.8 -0.6 2.8 3.3 Q 2.8 8.4 0.2 8.4 Q -2.3 8.4 -2.6 5.8',
  '6': 'M 2.0 -7.6 Q -2.7 -4.5 -2.7 -1.5 L -2.7 6.2 Q -2.7 8.4 0.3 8.4 Q 2.8 8.4 2.8 6.0 L 2.8 2.6 Q 2.8 0.2 0.1 0.2 Q -2.6 0.2 -2.7 2.4',
  '7': 'M -2.6 -8.4 L 2.6 -8.4 L -0.6 8.4',
  '8': 'M 0 -0.3 Q -2.2 -0.3 -2.2 -2.0 L -2.2 -6.0 Q -2.2 -8.4 0 -8.4 Q 2.2 -8.4 2.2 -6.0 L 2.2 -2.0 Q 2.2 -0.3 0 -0.3 Q -2.7 -0.3 -2.7 2.2 L -2.7 6.2 Q -2.7 8.4 0 8.4 Q 2.7 8.4 2.7 6.2 L 2.7 2.2 Q 2.7 -0.3 0 -0.3 Z',
  '9': 'M -0.6 8.4 L 2.6 -1.0 L 2.6 -5.7 Q 2.6 -8.4 0 -8.4 Q -2.6 -8.4 -2.6 -5.7 Q -2.6 -3.0 0 -3.0 Q 2.6 -3.0 2.6 -5.7'
};

// Active digit set — original hand-drawn vintage-gauge numerals (height
// -8.4..8.4, width +-2.76, stroke 2.9 — matches the Jaeger thermometer
// numerals; '0' is the shorter stadium shape per the original reference
// photo).
const GLYPH = {
  '-': 'M -2.76 0 L 2.76 0',
  '0': 'M -3.0 -5.4 L -3.0 5.4 A 3.0 3.0 0 0 0 3.0 5.4 L 3.0 -5.4 A 3.0 3.0 0 0 0 -3.0 -5.4 Z',
  '1': 'M -1.56 -5.52 L 0 -8.4 L 0 8.4',
  '2': 'M -2.76 -5.52 Q -2.76 -8.4 -1.08 -8.4 L 1.08 -8.4 Q 2.76 -8.4 2.76 -5.52 Q 2.76 -2.4 1.44 0 L -2.76 5.52 L -2.76 8.4 L 2.76 8.4',
  '3': 'M -2.76 -5.52 Q -2.76 -8.4 -1.08 -8.4 L 1.08 -8.4 Q 2.76 -8.4 2.76 -5.52 L 2.76 -2.02 Q 2.76 0.32 0.96 0.32 L -0.24 0.32 M -0.24 1.28 L 0.96 1.28 Q 2.76 1.28 2.76 3.42 L 2.76 6.26 Q 2.76 8.4 1.08 8.4 L -1.08 8.4 Q -2.76 8.4 -2.76 5.52',
  '4': 'M 1.4 8.4 L 1.4 -8.4 L -2.76 3.8 L 2.76 3.8',
  '5': 'M 2.76 -8.4 L -2.76 -8.4 L -2.76 0.8 L -0.24 0.8 Q 2.76 0.8 2.76 3.08 L 2.76 6.12 Q 2.76 8.4 1.08 8.4 L -1.08 8.4 Q -2.64 8.4 -2.76 6.48',
  '6': 'M 2.2 -8 Q -2.76 -5 -2.76 -2 L -2.76 6.5 Q -2.76 8.4 0.6 8.4 Q 2.76 8.4 2.76 6.5 L 2.76 2.7 Q 2.76 0.8 0 0.8 Q -2.76 0.8 -2.76 2.7',
  '7': 'M -2.76 -8.4 L 2.76 -8.4 L -0.6 8.4',
  '8': 'M 0 0.8 Q -2.2 0.8 -2.76 -1.3 L -2.76 -6.1 Q -2.76 -8.4 0 -8.4 Q 2.76 -8.4 2.76 -6.1 L 2.76 -1.3 Q 2.76 0.8 0 0.8 Q -2.76 0.8 -2.76 2.7 L -2.76 6.5 Q -2.76 8.4 0 8.4 Q 2.76 8.4 2.76 6.5 L 2.76 2.7 Q 2.76 0.8 0 0.8 Z',
  '9': 'M -2.2 8.0 Q 2.76 8.0 2.76 6.1 L 2.76 -5.85 Q 2.76 -8.4 0 -8.4 Q -2.76 -8.4 -2.76 -5.85 L -2.76 -0.75 Q -2.76 1.8 0 1.8 Q 2.76 1.8 2.76 -0.75'
};
const PITCH_WIDE = 12.5, PITCH_NARROW = 10.5, GLYPH_STROKE = 2.9;

(function drawSpeedDial() {
  const ticks = document.getElementById("speedTicks");
  const nums  = document.getElementById("speedNumerals");
  const _outerDx = tickX[0] - fanOX;
  const _outerD  = Math.hypot(_outerDx, tickBottomY - fanOY);
  const _outerUy = (tickBottomY - fanOY) / _outerD;
  const tickTopY = tickBottomY + tickLen * _outerUy;

  // 200 marker matches the over-limit glow (red) — same colour used for
  // the chrome-ring/needle escalation. 150 stays the normal tick colour.
  SPEED_MARKS.forEach((v, i) => {
    const markColor = v === 200 ? "#d64545" : "#d8dfe1";
    const tx = tickX[i], nx = numX[i];
    const dx = tx - fanOX, dy = tickBottomY - fanOY;
    const d  = Math.hypot(dx, dy);
    const ux = dx / d, uy = dy / d;
    const L  = (tickTopY - tickBottomY) / uy;
    const x2 = tx + L * ux, y2 = tickTopY;
    const halfW = 6.5 / 2, xOff = halfW / uy;
    const pts = [[tx + xOff, tickBottomY], [tx - xOff, tickBottomY], [x2 - xOff, y2], [x2 + xOff, y2]]
      .map(p => p.join(",")).join(" ");
    ticks.appendChild(el("polygon", { points: pts, fill: markColor }));

    const chars = String(v).split("");
    const offsets = [0];
    for (let k = 1; k < chars.length; k++) {
      const narrow = chars[k] === '1' || chars[k-1] === '1';
      offsets.push(offsets[k-1] + (narrow ? PITCH_NARROW : PITCH_WIDE));
    }
    const totalW = offsets[offsets.length - 1];
    const numGroup = el("g", { transform: `translate(${nx} ${numY})` });
    chars.forEach((ch, idx) => {
      const gx = offsets[idx] - totalW / 2;
      numGroup.appendChild(el("path", {
        d: GLYPH[ch], fill: "none", stroke: "#d8dfe1",
        "stroke-width": GLYPH_STROKE, "stroke-linecap": "round", "stroke-linejoin": "round",
        transform: `translate(${gx} 0)`
      }));
    });
    nums.appendChild(numGroup);
  });
})();

const speedNeedle  = document.getElementById("speedNeedle");
const speedDigital = document.getElementById("speedDigital");
const speedBezelGlow = document.getElementById("speedBezelGlow");
const speedBgGlowRed = document.getElementById("speedBgGlowRed");
const speedLouverGlowRed = document.getElementById("speedLouverGlowRed");
const speedWarnDigitsEl = document.getElementById("speedWarnDigits");
const speedBigDigitsEl  = document.getElementById("speedBigDigits");

// Scherm 2's big digital speedo readout — same hand-drawn glyph font as
// the tick numerals/limit sign, always kept up to date (even while
// hidden on Scherm 1) so it's instantly correct the moment SCHERM 2 is
// toggled on. Its own simple 3-tier colour scheme:
//   "normal"   — plain white, no glow (at/under the limit)
//   "yellow"   — static amber (0-4 km/h over)
//   "red-glow" — bright red, slowly pulsing (5-30 km/h over — matches
//                the Scherm 1 digit readout and needle glow)
function renderSpeedBigDigits(value, tier) {
  while (speedBigDigitsEl.firstChild) speedBigDigitsEl.removeChild(speedBigDigitsEl.firstChild);
  const chars = String(Math.round(Math.max(0, value))).split("");
  const offsets = [0];
  for (let k = 1; k < chars.length; k++) {
    const narrow = chars[k] === "1" || chars[k-1] === "1";
    offsets.push(offsets[k-1] + (narrow ? PITCH_NARROW : PITCH_WIDE));
  }
  const totalW = offsets[offsets.length - 1];
  function digitGroup(cls, stroke, strokeW, filterAttr) {
    const g = el("g", filterAttr ? { class: cls, filter: filterAttr } : { class: cls });
    chars.forEach((ch, idx) => {
      const gx = offsets[idx] - totalW / 2;
      g.appendChild(el("path", {
        d: GLYPH[ch], fill: "none", stroke,
        "stroke-width": strokeW, "stroke-linecap": "round", "stroke-linejoin": "round",
        transform: `translate(${gx} 0)`
      }));
    });
    return g;
  }
  // "yellow" (0-4 over) stays static amber; "red-glow" (5-30+ over) is
  // now bright red and glowing, per request — same red as the Scherm 1
  // digit readout / needle / ring glow elsewhere in the app.
  const crispColor = tier === "normal" ? "#ffffff" : tier === "yellow" ? "#ffd83d" : "#ff4d4d";
  const glowColor = tier === "red-glow" ? "#ff4d4d" : "#ffd83d";
  speedBigDigitsEl.appendChild(digitGroup("speed-big-digit-glow", glowColor, GLYPH_STROKE + 2.5, "url(#coldGlowS)"));
  speedBigDigitsEl.appendChild(digitGroup("speed-big-digit-crisp", crispColor, GLYPH_STROKE, null));
  speedBigDigitsEl.classList.toggle("yellow-glow", false);
  speedBigDigitsEl.classList.toggle("red-glow", tier === "red-glow");
  // Shifted up further from y=170 per request — except on Scherm 3,
  // which centres it in the middle of the dial and scales it 70% bigger.
  const screen3 = document.body.classList.contains("mode-screen3");
  const bigCenterY = screen3 ? 200 : 155;
  const bigScale = screen3 ? 6 * 1.7 : 6;
  speedBigDigitsEl.setAttribute("transform", `translate(200 ${bigCenterY}) scale(${bigScale})`);
}

/* Needle-red-glow and ring-red-glow are driven by ONE shared JS clock
   instead of two separate CSS animations. Two independent CSS
   animations with identical duration can still drift apart frame to
   frame on real devices (compositor scheduling, dropped frames), so
   instead both elements read the exact same computed opacity value
   every animation frame — sync is then structural, not timing-based. */
const speedNeedleRedGlowEl = document.querySelector("#speedNeedle .needle-red-glow");
const speedBezelRedGlowEl  = document.querySelector("#speedBezelGlow .speed-bezel-glow-red");
const SPEED_GLOW_PERIOD_MS = 1400;
let speedNeedleGlowing = false, speedRingGlowing = false;
let speedGlowRafId = null, speedGlowStartTime = null;
function speedGlowTick(now) {
  if (speedGlowStartTime === null) speedGlowStartTime = now;
  const t = (now - speedGlowStartTime) % SPEED_GLOW_PERIOD_MS;
  const opacity = 0.425 * (1 - Math.cos((t / SPEED_GLOW_PERIOD_MS) * Math.PI * 2));
  if (speedNeedleRedGlowEl) speedNeedleRedGlowEl.style.opacity = speedNeedleGlowing ? opacity : 0;
  if (speedBezelRedGlowEl)  speedBezelRedGlowEl.style.opacity  = speedRingGlowing  ? opacity : 0;
  // Background + wave band always accompany the ring (same "extreme"
  // condition) — driven from this same clock so the whole dial pulses
  // in the identical rhythm as the needle and ring.
  if (speedBgGlowRed)     speedBgGlowRed.style.opacity     = speedRingGlowing ? opacity : 0;
  if (speedLouverGlowRed) speedLouverGlowRed.style.opacity = speedRingGlowing ? opacity : 0;
  if (speedNeedleGlowing || speedRingGlowing) {
    speedGlowRafId = requestAnimationFrame(speedGlowTick);
  } else {
    speedGlowRafId = null;
    speedGlowStartTime = null; // next activation starts the pulse fresh at 0
  }
}
function setSpeedGlowState(needleOn, ringOn) {
  speedNeedleGlowing = needleOn;
  speedRingGlowing = ringOn;
  if ((needleOn || ringOn) && speedGlowRafId === null) {
    speedGlowRafId = requestAnimationFrame(speedGlowTick);
  } else if (!needleOn && !ringOn) {
    if (speedNeedleRedGlowEl) speedNeedleRedGlowEl.style.opacity = 0;
    if (speedBezelRedGlowEl)  speedBezelRedGlowEl.style.opacity = 0;
    if (speedBgGlowRed)       speedBgGlowRed.style.opacity = 0;
    if (speedLouverGlowRed)   speedLouverGlowRed.style.opacity = 0;
  }
}

// Same hand-drawn glyph font as the dial numerals, 50% larger, placed
// lower-right between the numeral ring and the wave band. When "glowing"
// is set (5-30 km/h over the limit), an extra blurred bright-red layer
// pulses behind the crisp digits — same red/pulse as the needle glow.
function renderSpeedWarnDigits(value, color, glowing = false) {
  while (speedWarnDigitsEl.firstChild) speedWarnDigitsEl.removeChild(speedWarnDigitsEl.firstChild);
  const chars = String(Math.round(value)).split("");
  const offsets = [0];
  for (let k = 1; k < chars.length; k++) {
    const narrow = chars[k] === "1" || chars[k-1] === "1";
    offsets.push(offsets[k-1] + (narrow ? PITCH_NARROW : PITCH_WIDE));
  }
  const totalW = offsets[offsets.length - 1];

    const g = el("g", filterAttr ? { class: cls, filter: filterAttr } : { class: cls });

      g.appendChild(el("path", {
        d: GLYPH[ch], fill: "none", stroke,
        "stroke-width": strokeW, "stroke-linecap": "round", "stroke-linejoin": "round",
        transform: `translate(${gx} 0)`
      }));
    });
    return g;
  }
  speedWarnDigitsEl.appendChild(digitGroup("speed-warn-digit-glow", "#ff4d4d", GLYPH_STROKE + 2.5, "url(#coldGlowS)"));
  speedWarnDigitsEl.appendChild(digitGroup("speed-warn-digit-crisp", color, GLYPH_STROKE, null));

  speedWarnDigitsEl.setAttribute("transform", "translate(260 198) scale(1.5)");

  while (speedWarnDigitsEl.firstChild) speedWarnDigitsEl.removeChild(speedWarnDigitsEl.firstChild);

const SPEED_MIN = 0, SPEED_MAX = 220;
let currentLimit = null; // km/h, or null if unknown/infinite
let limitKind = "unknown"; // "unknown" | "known" | "infinite" — drives ring colour + pings

/* ---------------------------------------------------------------------
   Old-fashioned siren, synthesised with Web Audio (no audio asset
   needed): a sine tone whose pitch is slowly swept up and down by a
   low-frequency oscillator, like an analog police-car wail. Started
   only once speed is >30 km/h over the limit, stopped as soon as it
   drops back below. */
let sirenCtx = null, sirenOsc = null, sirenLFO = null, sirenGain = null, sirenActive = false;
function ensureSirenCtx() {
  if (!sirenCtx) {
    try { sirenCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  }
  return sirenCtx;
}
function startSiren() {
  if (sirenActive) return;
  const ctx = ensureSirenCtx();
  if (!ctx) return;
  try {
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    sirenOsc = ctx.createOscillator();
    sirenLFO = ctx.createOscillator();
    const lfoGain = ctx.createGain();
    sirenGain = ctx.createGain();
    sirenOsc.type = "sine";
    sirenOsc.frequency.value = 600;
    sirenLFO.type = "sine";
    sirenLFO.frequency.value = 0.5;   // one full wail up-and-down every 2s
    lfoGain.gain.value = 250;         // sweeps ~350-850 Hz
    sirenLFO.connect(lfoGain);
    lfoGain.connect(sirenOsc.frequency);
    sirenGain.gain.value = 0.35;
    sirenOsc.connect(sirenGain);
    sirenGain.connect(ctx.destination);
    sirenOsc.start();
    sirenLFO.start();
    sirenActive = true;
  } catch { sirenActive = false; }
}
function stopSiren() {
  if (!sirenActive) return;
  sirenActive = false;
  try { sirenOsc && sirenOsc.stop(); } catch {}
  try { sirenLFO && sirenLFO.stop(); } catch {}
  sirenOsc = null; sirenLFO = null; sirenGain = null;
}
// iOS/Safari only allow *resuming* an AudioContext from within a real
// user-gesture call stack — just creating the context (the old code)
// isn't enough, it's still born "suspended" on iOS and a later
// ctx.resume() from an async GPS callback is silently ignored. So on
// the very first tap anywhere, explicitly resume() here AND fire a
// near-silent blip to fully warm up the audio pipeline, so the siren
// can actually play later even though it's triggered from GPS, not a tap.
function unlockSirenAudio() {
  const ctx = ensureSirenCtx();
  if (!ctx) return;
  if (ctx.state === "suspended") ctx.resume().catch(() => {});
  try {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    g.gain.value = 0.0001; // effectively silent, just to unlock the pipeline
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.05);
  } catch {}
}
document.addEventListener("click", unlockSirenAudio, { once: true });
document.addEventListener("touchstart", unlockSirenAudio, { once: true, passive: true });

// Sonar-style ping whenever the live speed limit actually changes value
// (reuses the siren's AudioContext, already unlocked by the tap above).
// Pitched up for a higher new limit, down for a lower one. Three
// synthesis styles below, switchable live with the PING A/B/C buttons —
// real active sonar is a steady (non-swept) pure tone with a long
// reverberant ring-out, which a single fast-decaying "blip" (the first
// attempt) doesn't capture.
let PING_VARIANT = "B"; // chosen: wobbly pure tone, no echo

// A — "classic movie sonar": steady pure tone, quick attack, long
// exponential ring-out, plus a feedback delay loop so it fades out in a
// series of repeating echoes (the "ping....ping....ping" underwater tail).
function sonarPingA(ctx, now, freq) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, now);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.35, now + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.09, now + 0.3);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
  const delay = ctx.createDelay(1.0);
  delay.delayTime.value = 0.22;
  const feedback = ctx.createGain();
  feedback.gain.value = 0.35;
  delay.connect(feedback);
  feedback.connect(delay);
  osc.connect(gain);
  gain.connect(ctx.destination);
  gain.connect(delay);
  delay.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 1.6);
}

// B — chosen variant: one single steady pure tone, quick attack, long
// ring-out, no delay/echo. A light vibrato — subtler than the earlier
// attempt that read as "repetition" — just a slight wobble on the tone.
function sonarPingB(ctx, now, freq) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, now);
  const vibrato = ctx.createOscillator();
  vibrato.type = "sine";
  vibrato.frequency.value = 6;
  const vibratoGain = ctx.createGain();
  vibratoGain.gain.value = freq * 0.006;
  vibrato.connect(vibratoGain);
  vibratoGain.connect(osc.frequency);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.3, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now); vibrato.start(now);
  osc.stop(now + 1.4); vibrato.stop(now + 1.4);
}

// C — "depth-sounder": short sharp pulse, silence, then one distinct
// quieter "return echo" pulse a fraction lower in pitch — mimics a single
// ping bouncing back, rather than a continuously decaying tail.
function sonarPingC(ctx, now, freq) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, now);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.35, now + 0.006);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.25);

  const echoOsc = ctx.createOscillator();
  const echoGain = ctx.createGain();
  echoOsc.type = "sine";
  echoOsc.frequency.value = freq * 0.97;
  echoOsc.connect(echoGain);
  echoGain.connect(ctx.destination);
  const echoStart = now + 0.55;
  echoGain.gain.setValueAtTime(0.0001, echoStart);
  echoGain.gain.exponentialRampToValueAtTime(0.15, echoStart + 0.006);
  echoGain.gain.exponentialRampToValueAtTime(0.0001, echoStart + 0.3);
  echoOsc.start(echoStart);
  echoOsc.stop(echoStart + 0.32);
}

function playLimitChangePing(higher, variant = PING_VARIANT) {
  const ctx = ensureSirenCtx();
  if (!ctx) return;
  try {
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const now = ctx.currentTime;
    // Reversed: "higher" (increase / more open state) now plays the low
    // tone, "lower" (decrease / more specific state) plays the high tone.
    const freq = higher ? 500 : 1300;
    if (variant === "B") sonarPingB(ctx, now, freq);
    else if (variant === "C") sonarPingC(ctx, now, freq);
    else sonarPingA(ctx, now, freq);
  } catch {}
}

function pointSpeedTo(v, opts = {}) {
  const clamped = Math.max(SPEED_MIN, Math.min(SPEED_MAX, v));
  speedNeedle.style.transform = `rotate(${speedAngle(clamped)}deg)`;
  const suppress = !!opts.suppressWarn;
  const delta = typeof currentLimit === "number" ? v - currentLimit : null;
  // 0-5 over: amber (needle + digit readout only).
  // 5-30 over: red (needle + digit readout), ring still off.
  // >=30 over: extreme — ring joins in too, plus background/wave-band
  // glow and the siren. Needle and ring both read the same shared JS
  // pulse clock (setSpeedGlowState below), so whenever both are
  // glowing they're always perfectly in sync, no drift over time.
  const red    = !suppress && delta !== null && delta >= 5;
  const hot    = !suppress && !red && delta !== null && delta > 0;
  const extreme = !suppress && delta !== null && delta >= 30;
  speedNeedle.classList.toggle("hot-warn", hot);
  setSpeedGlowState(red, extreme);
  if (extreme) startSiren(); else stopSiren();
  // Scherm 1: always show the current speed as digits in the dial (same
  // spot/font/size as the old over-limit-only readout) — white when at
  // or under the limit (or no limit known), amber when 0-5 over, bright
  // red + glowing when 5-30+ over. Hidden entirely on Scherm 2 via CSS
  // (that screen has its own big number).
  if (red) renderSpeedWarnDigits(v, "#ff4d4d", true);
  else if (hot) renderSpeedWarnDigits(v, "#ffb347");
  else renderSpeedWarnDigits(v, "#ffffff");
  // Scherm 2/3's big digit: 0-4 over the limit = static amber, 5-30+
  // over = bright red glow (same red as the Scherm 1 readout/needle).
  renderSpeedBigDigits(clamped, red ? "red-glow" : (hot ? "yellow" : "normal"));
  // Mirrors whatever pointSpeedTo() is actually driving right now — real
  // GPS speed or a TEST RUN/TEST LIMIT WARN step — so the map dial's
  // speed number tracks the tests too, not just live position updates.
  updateMapSpeedInfo(clamped);
  if (opts.showDigital) speedDigital.textContent = `${v.toFixed(0)}`;
  else if (!testRunActive) speedDigital.textContent = "";
}

/* =====================================================================
   COMPASS DIAL — identical mechanics to Jaeger (kept optional / off
   by default; toggled with the COMPASS ON/OFF button).
===================================================================== */
(function drawCompass() {
  const ticks   = document.getElementById("windTicks");
  const letters = document.getElementById("windLetters");
  for (let deg = 0; deg < 360; deg += 10) {
    const isCardinal = deg % 90 === 0;
    const isMajor    = deg % 30 === 0;
    const isOffMajor = isMajor && !isCardinal;
    let strokeW, innerR, op;
    if (isCardinal)      { strokeW = 6.5; innerR = 98;  op = 1; }
    else if (isOffMajor) { strokeW = 3.5; innerR = 111; op = 1; }
    else                 { strokeW = 1;   innerR = 118; op = .7; }
    const [x1, y1] = polar(CX, CY, 124, deg);
    const [x2, y2] = polar(CX, CY, innerR, deg);
    ticks.appendChild(el("line", { x1, y1, x2, y2, stroke: "#f0e8d0", "stroke-width": strokeW, "stroke-linecap": "butt", opacity: op }));
  }
  const cardinals = [
    {deg:0,   t:"N",  big:true}, {deg:45,  t:"NE"},
    {deg:90,  t:"E",  big:true, sz:24}, {deg:135, t:"SE"},
    {deg:180, t:"S",  big:true, sz:24}, {deg:225, t:"SW"},
    {deg:270, t:"W",  big:true}, {deg:315, t:"NW"}
  ];
  const LETTER_R = 80;
  cardinals.forEach(c => {
    const size = c.sz ?? (c.big ? 19 : 10);
    const dy   = c.big ? (c.sz ? 8.6 : 6.8) : 4;
    const [x, y] = polar(CX, CY, LETTER_R, c.deg);
    letters.appendChild(el("text", {
      x, y: y + dy, "text-anchor": "middle", transform: `rotate(${c.deg} ${x} ${y})`,
      "font-family": "Futura, 'Century Gothic', sans-serif", "font-size": size, "font-weight": 700, fill: "#f0e8d0"
    }, c.t));
  });
})();

const compassGauge  = document.getElementById("compassGauge");
const compassFace   = document.getElementById("compassFace");
const useCompassBtn = document.getElementById("useCompassBtn");
const compassOffsetRow = document.getElementById("compassOffsetRow");
const compassOffsetMinus = document.getElementById("compassOffsetMinus");
const compassOffsetPlus  = document.getElementById("compassOffsetPlus");
const compassPermitBtn   = document.getElementById("compassPermitBtn");
const screen2Btn = document.getElementById("screen2Btn");
const mirrorBtn  = document.getElementById("mirrorBtn");
const compassOffsetValue = document.getElementById("compassOffsetValue");

let compassVisible = true;

function getScreenRotation() {
  if (screen.orientation && typeof screen.orientation.angle === "number") return screen.orientation.angle;
  if (typeof window.orientation === "number") return window.orientation;
  return 0;
}
function applyCompassRotation() {
  if (lastHeading === null || !compassFace) return;
  const orient = getScreenRotation();
  let corrected = (lastHeading + orient + compassOffset) % 360;
  if (corrected < 0) corrected += 360;
  compassFace.style.transform = `rotate(${-corrected}deg)`;
}
function onCompass(e) {
  let heading = null;
  if (typeof e.webkitCompassHeading === "number") heading = e.webkitCompassHeading;
  else if (typeof e.alpha === "number") heading = 360 - e.alpha;
  if (heading === null || !compassFace) return;
  lastHeading = heading;
  applyCompassRotation();
}
window.addEventListener("orientationchange", applyCompassRotation);
if (screen.orientation && typeof screen.orientation.addEventListener === "function") {
  screen.orientation.addEventListener("change", applyCompassRotation);
}

const COMPASS_VISIBLE_KEY = "hud.compassVisible";
const COMPASS_OFFSET_KEY  = "hud.compassOffset";
function loadCompassOffset() {
  try {
    const saved = localStorage.getItem(COMPASS_OFFSET_KEY);
    if (saved !== null) { compassOffset = Math.max(-180, Math.min(180, parseInt(saved, 10) || 0)); return; }
  } catch {}
  compassOffset = 0;
}
function saveCompassOffset() { try { localStorage.setItem(COMPASS_OFFSET_KEY, String(compassOffset)); } catch {} }
function updateCompassOffsetDisplay() {
  if (compassOffsetValue) compassOffsetValue.textContent = (compassOffset >= 0 ? "+" : "") + compassOffset + "°";
}

async function enableCompass() {
  if (compassActive) return { success: true };
  if (typeof DeviceOrientationEvent === "undefined") return { success: false, reason: "UNSUPPORTED" };
  try {
    if (typeof DeviceOrientationEvent.requestPermission === "function") {
      const status = await DeviceOrientationEvent.requestPermission();
      if (status !== "granted") return { success: false, reason: status.toUpperCase() };
    }
  } catch (err) { return { success: false, reason: "ERROR" }; }
  window.addEventListener("deviceorientationabsolute", onCompass, true);
  window.addEventListener("deviceorientation", onCompass, true);
  compassActive = true;
  if (compassOffsetRow) compassOffsetRow.style.display = "flex";
  return { success: true };
}

// requestPermission() called automatically at boot (as setCompassVisible
// does) is silently denied there, same gesture-requirement issue as the
// geolocation/audio unlocks elsewhere. So show a yellow action button on
// top of the dial whenever that's still the case, on both screens.
function needsCompassPermission() {
  return typeof DeviceOrientationEvent !== "undefined"
      && typeof DeviceOrientationEvent.requestPermission === "function"
      && !compassActive;
}

  compassPermitBtn.classList.toggle("show", compassVisible && needsCompassPermission());
}
compassPermitBtn.addEventListener("click", () => {
  enableCompass().then(r => {
    if (!r.success) setStatus(`— KOMPAS ${r.reason} —`, true);
    updateCompassPermitVisibility();
  });
});

function setCompassVisible(v) {
  compassVisible = v;
  compassGauge.style.display = v ? "" : "none";
  useCompassBtn.textContent = v ? "COMPASS OFF" : "COMPASS ON";
  try { localStorage.setItem(COMPASS_VISIBLE_KEY, v ? "1" : "0"); } catch {}
  if (v && !compassActive) {
    enableCompass().then(r => {
      if (!r.success) setStatus(`— KOMPAS ${r.reason} —`, true);
      updateCompassPermitVisibility();

  }

}

  compassOffset = Math.max(-180, Math.min(180, compassOffset + delta));
  saveCompassOffset(); updateCompassOffsetDisplay(); applyCompassRotation();
}

const SWIPE_MIN_DX = 60;

/* =====================================================================
   GEOLOCATION — continuous watch (speed + position for speed-limit
   lookups and navigation). Falls back to a haversine-derived speed
   when coords.speed is unavailable (common on first fixes).
===================================================================== */
const statusEl  = document.getElementById("statusLine");
const locModeEl = document.getElementById("locMode");
const useLocBtn = document.getElementById("useLocBtn");
function setStatus(msg, err=false) { statusEl.textContent = msg; statusEl.className = err ? "err" : "status"; }
function setLocMode(tag) { locModeEl.innerHTML = `<span class="tag">LOC</span> ${tag}`; }

let watchId = null;
let lastPos = null;      // {lat, lon, t}
let lastSpeedKmh = null;

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function onPosition(p) {
  const { latitude: lat, longitude: lon, speed, accuracy, heading } = p.coords;
  const t = p.timestamp;
  const prevPos = lastPos;
  lastLiveAccuracy = typeof accuracy === "number" ? accuracy : null;
  if (!signalTestActive) renderSignalQuality(lastLiveAccuracy);
  let kmh;
  if (typeof speed === "number" && speed >= 0) {
    kmh = speed * 3.6;
  } else if (lastPos) {
    const dt = (t - lastPos.t) / 1000;
    if (dt > 0.5) {
      const meters = haversineMeters(lastPos.lat, lastPos.lon, lat, lon);
      kmh = (meters / dt) * 3.6;
    }
  }
  lastPos = { lat, lon, t };
  updateMapGauge(lat, lon, heading, prevPos);
  if (typeof kmh === "number" && isFinite(kmh)) {
    lastSpeedKmh = kmh;
    if (!testRunActive && !speedWarnTestActive) pointSpeedTo(kmh);
  }
  updateMapSpeedInfo();
  setLocMode(`${lat.toFixed(4)}°, ${lon.toFixed(4)}°`);
  maybeFetchSpeedLimit(lat, lon);
  maybeFetchWeather(lat, lon);
  navOnPosition(lat, lon);
}
function onPositionError(err) {
  const reason = err && err.code === 1 ? "DENIED" : err && err.code === 2 ? "UNAVAILABLE" : err && err.code === 3 ? "TIMEOUT" : "ERROR";
  setLocMode(reason);
  setStatus(`— LOCATIE ${reason} —`, true);
  lastLiveAccuracy = null;
  if (!signalTestActive) renderSignalQuality(null); // no usable fix — worst tier
}
function startWatch() {
  if (!navigator.geolocation) { setStatus("— GEOLOCATIE NIET ONDERSTEUND —", true); return; }
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
    enableHighAccuracy: true, maximumAge: 500, timeout: 20000
  });
}
useLocBtn.addEventListener("click", () => { setStatus("— LOCATIE AANVRAGEN —"); startWatch(); });
// Auto-start on load — EXCEPT in iOS standalone (Add to Home Screen)
// mode. iOS silently denies a geolocation request that isn't triggered
// by a genuine tap when running standalone, and — worse — remembers
// that denial for good. So in standalone mode we wait for the user's
// first tap on USE LOCATION (or anywhere, via the listener below)
// instead of ever auto-requesting, which is what caused it to get
// stuck on DENIED for PWA installs.
if (document.body.classList.contains("ios-standalone")) {
  setStatus("— TIK OM LOCATIE TE ACTIVEREN —");
  document.addEventListener("click", startWatch, { once: true });
  document.addEventListener("touchstart", startWatch, { once: true, passive: true });
} else {
  startWatch();
}

const limitValueEl = document.getElementById("limitValue");

const LIMIT_DIGIT_SCALE = 3.4;

// as the other dials, just a different colour/anchor per sign.
function renderLimitDigitsInto(targetEl, text, color, y, scale) {
  while (targetEl.firstChild) targetEl.removeChild(targetEl.firstChild);
  if (text === "∞") {
    // The hand-drawn digit set has no infinity glyph — fall back to text.
    targetEl.appendChild(el("text", {
      x: 0, y: 0, "text-anchor": "middle", "dominant-baseline": "central",
      "font-family": "Futura, 'Century Gothic', sans-serif",
      "font-size": 80 * (scale / LIMIT_DIGIT_SCALE), "font-weight": 700, fill: color
    }, "∞"));
    targetEl.setAttribute("transform", `translate(200 ${y})`);
    return;
  }
  const chars = text.split("");
  const offsets = [0];
  for (let k = 1; k < chars.length; k++) {
    const narrow = chars[k] === "1" || chars[k-1] === "1" || chars[k] === "-" || chars[k-1] === "-";
    offsets.push(offsets[k-1] + (narrow ? PITCH_NARROW : PITCH_WIDE));
  }
  const totalW = offsets[offsets.length - 1];
  chars.forEach((ch, idx) => {
    const gx = offsets[idx] - totalW / 2;
    targetEl.appendChild(el("path", {
      d: GLYPH[ch], fill: "none", stroke: color,
      "stroke-width": GLYPH_STROKE, "stroke-linecap": "round", "stroke-linejoin": "round",
      transform: `translate(${gx} 0)`

const limitFace2El = document.getElementById("limitFace2El");

function applyLimitDisplay(kind, text) {

  renderLimitDigits2(text, kind);

function limitTextFor(kind, value) {

}
// Sonar ping for a genuine limit-state change:
//  - known -> known (value changed): one ping, tone = higher/lower.
//  - unknown -> known, infinite -> known: 2 low pings ("arriving at a
//    concrete number" reads the same as a decrease).
//  - known -> unknown, anything -> infinite: 2 high pings ("leaving to a
//    less specific/open state" reads the same as an increase) — except
//    known -> unknown specifically, which is also 2 low pings.
// unknown <-> infinite directly isn't specified and stays silent.
const PING_DOUBLE_GAP_MS = 400;
function playDoublePing(higher) {
  playLimitChangePing(higher);
  setTimeout(() => playLimitChangePing(higher), PING_DOUBLE_GAP_MS);
}
function playLimitTransitionPing(prevKind, prevValue, newKind, newValue) {
  if (prevKind === newKind) {
    if (prevKind === "known" && newValue !== prevValue) playLimitChangePing(newValue > prevValue);
    return;
  }
  if (newKind === "infinite") { playDoublePing(true); return; }
  if (newKind === "known" && (prevKind === "unknown" || prevKind === "infinite")) { playDoublePing(false); return; }
  if (newKind === "unknown" && prevKind === "known") { playDoublePing(false); return; }
}
// The one entry point for a *real* limit-state change: updates the
// display, then pings based on the actual prev -> new transition.
function setLimitState(newKind, newValue) {
  const prevKind = limitKind, prevValue = currentLimit;
  limitKind = newKind;
  currentLimit = newKind === "known" ? newValue : null;
  applyLimitDisplay(newKind, limitTextFor(newKind, newValue));
  playLimitTransitionPing(prevKind, prevValue, newKind, newValue);

// Boot state: no fetch has run yet, so the sign starts "unknown" —
// amber ring + dashes — rather than the static red ring baked into the
// markup, and silently (no ping on app startup).
applyLimitDisplay("unknown", "--");
let lastLimitFetch = 0;
// Lowered from 8000 — the old throttle meant crossing into a new speed
// zone could take up to 8s to show. 4s is still light on the public
// Overpass instance for a single-user app.
const LIMIT_FETCH_INTERVAL_MS = 4000;

function parseMaxspeed(raw) {
  if (!raw) return null;
  const s = String(raw).trim().toLowerCase();
  if (s === "none") return Infinity;
  const mphMatch = s.match(/^(\d+)\s*mph$/);
  if (mphMatch) return Math.round(parseInt(mphMatch[1], 10) * 1.60934);
  const num = parseInt(s, 10);
  return isNaN(num) ? null : num;
}

/* Core Overpass lookup, shared by the live GPS polling below and the
   manual "ZOEK LIMIET" address test. Returns {value, raw} where value
   is a number (km/h), Infinity (no limit / Autobahn-style "none"), or
   null (no maxspeed tag found on the nearest way). Throws on network
   errors so callers can distinguish "no data" from "lookup failed". */
async function fetchMaxspeedAt(lat, lon) {
  const q = `[out:json][timeout:8];way(around:25,${lat},${lon})[highway][maxspeed];out tags 3;`;
  const r = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(q), { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  const way = j.elements && j.elements[0];
  const raw = way && way.tags && way.tags.maxspeed;
  const road = way && way.tags && (way.tags.name || way.tags.ref);
  return { value: parseMaxspeed(raw), raw: raw || null, road: road || null };
}

async function maybeFetchSpeedLimit(lat, lon) {
  if (speedWarnTestActive) return; // don't let a live fetch override the fixed 30 km/h test limit
  const now = Date.now();
  if (now - lastLimitFetch < LIMIT_FETCH_INTERVAL_MS) return;
  lastLimitFetch = now;
  try {
    const { value } = await fetchMaxspeedAt(lat, lon);
    if (value === Infinity) setLimitState("infinite", null);
    else if (typeof value === "number") setLimitState("known", value);
    else setLimitState("unknown", null);
  } catch { /* keep last known value, silent — public Overpass can be flaky */ }
}

/* ---------------- Manual address test (ZOEK LIMIET) ----------------
   Geocodes a typed address via Nominatim (OpenStreetMap's own geocoder,
   free, no key). Open-Meteo's geocoder only indexes place names/cities,
   not street addresses, so it can't resolve "Kerkstraat 12, Amsterdam" —
   Nominatim can, and it fits naturally with the Overpass maxspeed data
   we already use. One request per button click stays well within
   Nominatim's usage policy (max 1 req/s, no autocomplete-style polling). */
async function geocodeAddress(query) {
  const r = await fetch(
    "https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&accept-language=nl&q=" +
    encodeURIComponent(query),
    { cache: "no-store" }
  );
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  const hit = j && j[0];
  if (!hit) return null;
  return { lat: parseFloat(hit.lat), lon: parseFloat(hit.lon), label: hit.display_name };
}

const limitTestAddr = document.getElementById("limitTestAddr");
const limitTestBtn = document.getElementById("limitTestBtn");
const limitTestResult = document.getElementById("limitTestResult");
limitTestBtn.addEventListener("click", async () => {
  const query = limitTestAddr.value.trim();
  if (!query) { limitTestResult.textContent = "— VOER EEN ADRES IN —"; return; }
  limitTestResult.textContent = "— ZOEKEN —";
  try {
    const loc = await geocodeAddress(query);
    if (!loc) { limitTestResult.textContent = "— ADRES NIET GEVONDEN —"; return; }
    const { value, raw, road } = await fetchMaxspeedAt(loc.lat, loc.lon);
    const roadTxt = road ? ` (${road})` : "";
    if (value === Infinity) {
      applyLimitDisplay("infinite", "∞");
      limitTestResult.textContent = `${loc.label}${roadTxt} · GEEN LIMIET`;
    } else if (typeof value === "number") {
      applyLimitDisplay("known", String(value));
      limitTestResult.textContent = `${loc.label}${roadTxt} · ${value} KM/H`;
    } else {
      applyLimitDisplay("unknown", "--");
      limitTestResult.textContent = `${loc.label}${roadTxt} · GEEN MAXSPEED-TAG${raw ? ` (ruw: ${raw})` : ""}`;
    }
  } catch (e) {
    limitTestResult.textContent = "— FOUT: " + String(e.message || e).toUpperCase() + " —";
  }

  while (signalRingsEl.firstChild) signalRingsEl.removeChild(signalRingsEl.firstChild);
  let tierCount, color;
  if (typeof accuracyMeters === "number" && accuracyMeters <= 15) { tierCount = 1; color = "#4caf50"; }
  else if (typeof accuracyMeters === "number" && accuracyMeters <= 50) { tierCount = 2; color = "#ffb347"; }
  else { tierCount = 3; color = "#d64545"; }

let lastWeatherFetch = 0;
const WEATHER_FETCH_INTERVAL_MS = 10 * 60 * 1000;

/* Renders the temperature using the same hand-drawn vintage-gauge digit

    offsets.push(offsets[k-1] + (narrow ? PITCH_NARROW : PITCH_WIDE));

  // (starts ~228) and the open top of the face (~140) => y=184.
  // Scherm 3 (built on Scherm 2): centred in the true middle of the dial
  // instead, and 70% bigger again, per request.
  const scale = screen2 ? (screen3 ? FROST_DIGIT_SCALE * 2 * 1.7 : FROST_DIGIT_SCALE * 2) : FROST_DIGIT_SCALE;

  const wrapper = el("g", { transform: `translate(${digitsCenterX} ${centerY}) scale(${scale})` });
  wrapper.appendChild(digitGroup("frost-digit-glow-cold", "#4a90e2", GLYPH_STROKE + 2.5, "url(#coldGlowF)"));
  wrapper.appendChild(digitGroup("frost-digit-glow-hot",  "#ffb347", GLYPH_STROKE + 2.5, "url(#coldGlowF)"));
  wrapper.appendChild(digitGroup("frost-digit-glow-red",  "#d64545", GLYPH_STROKE + 2.5, "url(#coldGlowF)"));
  wrapper.appendChild(digitGroup("frost-digit-crisp",     crispColor, GLYPH_STROKE, null));
  frostDigitsEl.appendChild(wrapper);
}

function applyFrostWarnClasses(t) {
  const cold = t < COLD_WARN_BELOW;
  const red  = t > RED_WARN_ABOVE;
  const hot  = t > HOT_WARN_ABOVE && !red;
  frostIcon.classList.toggle("frost-warn", cold);
  // Ring no longer glows amber for the hot tier — cold/red ring glow stays.
  frostBezelGlow.classList.toggle("cold-warn", cold);
  frostBezelGlow.classList.toggle("red-warn",  red);
  frostDigitsEl.classList.toggle("cold-warn", cold);
  frostDigitsEl.classList.toggle("hot-warn",  hot);
  frostDigitsEl.classList.toggle("red-warn",  red);
}

async function maybeFetchWeather(lat, lon) {
  const now = Date.now();
  if (now - lastWeatherFetch < WEATHER_FETCH_INTERVAL_MS) return;
  lastWeatherFetch = now;
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const t = j.current?.temperature_2m;
    if (typeof t !== "number") return;
    lastLiveFrostTemp = t;
    if (frostTestActive) return; // don't let a live fetch interrupt the test run
    renderFrostTemp(t);
    applyFrostWarnClasses(t);
  } catch { /* keep last known reading */ }
}

   NAVIGATION — Mapbox geocoding + directions (turn-by-turn MVP).
   Requires a free Mapbox access token, entered once and stored in
   localStorage. No automatic re-routing yet: if you go off-route,
   tap GA again with the same destination to recompute.
===================================================================== */
const MAPBOX_KEY_STORAGE = "hud.mapboxToken";
const navDest = document.getElementById("navDest");
const navGoBtn = document.getElementById("navGoBtn");
const navStopBtn = document.getElementById("navStopBtn");
const navInstruction = document.getElementById("navInstruction");
const navSub = document.getElementById("navSub");
const mapboxKeyBtn = document.getElementById("mapboxKeyBtn");

function getMapboxToken() { try { return localStorage.getItem(MAPBOX_KEY_STORAGE) || ""; } catch { return ""; } }
function setMapboxToken(tok) { try { localStorage.setItem(MAPBOX_KEY_STORAGE, tok); } catch {} }

mapboxKeyBtn.addEventListener("click", () => {
  const existing = getMapboxToken();
  const input = window.prompt("Plak je Mapbox public token (begint met pk.):", existing);
  if (input === null) return;
  setMapboxToken(input.trim());
  setStatus(input.trim() ? "— MAPBOX TOKEN OPGESLAGEN —" : "— MAPBOX TOKEN GEWIST —");
});

let navRoute = null;      // { steps: [...], destination: {lat,lon} }
let navActive = false;

async function mapboxGeocode(query, token) {
  const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${token}&limit=1`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("Geocoding HTTP " + r.status);
  const j = await r.json();
  const hit = j.features && j.features[0];
  if (!hit) return null;
  return { lon: hit.center[0], lat: hit.center[1], label: hit.place_name };
}

async function mapboxRoute(fromLat, fromLon, toLat, toLon, token) {
  const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${fromLon},${fromLat};${toLon},${toLat}` +
              `?steps=true&geometries=geojson&overview=simplified&language=nl&access_token=${token}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("Directions HTTP " + r.status);
  const j = await r.json();
  const route = j.routes && j.routes[0];
  if (!route) return null;
  const steps = route.legs[0].steps.map(s => ({
    instruction: s.maneuver.instruction,
    location: s.maneuver.location, // [lon, lat]
    distance: s.distance
  }));
  return { steps, distance: route.distance, duration: route.duration };
}

navGoBtn.addEventListener("click", async () => {
  const token = getMapboxToken();
  if (!token) { setStatus("— EERST MAPBOX KEY INSTELLEN —", true); return; }
  const query = navDest.value.trim();
  if (!query) { setStatus("— VOER EEN BESTEMMING IN —", true); return; }
  if (!lastPos) { setStatus("— WACHTEN OP GPS-POSITIE —", true); return; }
  navInstruction.textContent = "— ROUTE BEREKENEN —";
  try {
    const dest = await mapboxGeocode(query, token);
    if (!dest) { navInstruction.textContent = "— BESTEMMING NIET GEVONDEN —"; return; }
    const route = await mapboxRoute(lastPos.lat, lastPos.lon, dest.lat, dest.lon, token);
    if (!route || !route.steps.length) { navInstruction.textContent = "— GEEN ROUTE GEVONDEN —"; return; }
    navRoute = { steps: route.steps, stepIndex: 0, destination: dest };
    navActive = true;
    const mins = Math.round(route.duration / 60);
    const km = (route.distance / 1000).toFixed(1);
    navSub.textContent = `${dest.label} · ${km} KM · ~${mins} MIN`;
    updateNavInstruction();
  } catch (e) {
    navInstruction.textContent = "— NAVIGATIEFOUT: " + String(e.message || e).toUpperCase() + " —";
  }
});
navStopBtn.addEventListener("click", () => {
  navActive = false; navRoute = null;
  navInstruction.textContent = ""; navSub.textContent = "";
});

function updateNavInstruction() {
  if (!navRoute) return;
  const step = navRoute.steps[navRoute.stepIndex];
  if (!step) { navInstruction.textContent = "— AANGEKOMEN —"; navActive = false; return; }
  navInstruction.textContent = step.instruction;
}
function navOnPosition(lat, lon) {
  if (!navActive || !navRoute) return;
  const step = navRoute.steps[navRoute.stepIndex];
  if (!step) return;
  const [stepLon, stepLat] = step.location;
  const distToManeuver = haversineMeters(lat, lon, stepLat, stepLon);
  navSub.textContent = navSub.textContent.replace(/^.*?( · )/, distToManeuver < 999
    ? `${Math.round(distToManeuver)} M$1` : `${(distToManeuver/1000).toFixed(1)} KM$1`);
  if (distToManeuver < 25 && navRoute.stepIndex < navRoute.steps.length - 1) {
    navRoute.stepIndex++;
    updateNavInstruction();
  }
}

/* ---------------------------------------------------------------------
   Scherm 4's navigation dial: blue-only readout — maneuver icon,
   primary/secondary instruction text, distance caption, and a lane-
   guidance row. Same shape of data Mapbox's Directions API provides via
   banner_instructions (maneuver.type/modifier) and its optional
   sub.components lane array. Populated below with example data for
   review; wiring it to the live navRoute steps is a follow-up once the
   look is approved. */
const navIconEl     = document.getElementById("navIcon");
const navMainTextEl = document.getElementById("navMainText");
const navSubTextEl  = document.getElementById("navSubText");
const navDistTextEl = document.getElementById("navDistText");
const navLanesEl    = document.getElementById("navLanes");
const NAV_BLUE = "#4a90e2", NAV_BLUE_BRIGHT = "#9dccff", NAV_BLUE_DIM = "#2a4258";

function buildNavIconElements(type, modifier) {
  const t = type || "turn", m = modifier || "straight";
  if (t === "roundabout" || t === "rotary" || t === "roundabout turn" || t === "exit roundabout" || t === "exit rotary") {
    return [
      { tag: "circle", attrs: { cx: 0, cy: -8, r: 26 } },
      { tag: "path", attrs: { d: "M 22 -18 L 40 -30" } },
      { tag: "path", attrs: { d: "M 34 -38 L 40 -30 L 34 -22" } }
    ];
  }
  if (t === "merge" || t === "fork" || t === "on ramp" || t === "off ramp" || t === "end of road") {
    return [
      { tag: "path", attrs: { d: "M -28 25 Q -10 -10 10 -30" } },
      { tag: "path", attrs: { d: "M 28 25 Q 15 5 10 -30" } },
      { tag: "path", attrs: { d: "M 0 -45 L 10 -30 L -6 -22" } }
    ];
  }
  if (t === "arrive") {
    return [
      { tag: "path", attrs: { d: "M -8 25 L -8 -30" } },
      { tag: "path", attrs: { d: "M -8 -30 L 22 -18 L -8 -6 Z", fill: NAV_BLUE } }
    ];
  }
  if (/left|uturn/.test(m)) {
    return [
      { tag: "path", attrs: { d: "M 30 20 L 30 -10 Q 30 -30 10 -30 L -25 -30" } },
      { tag: "path", attrs: { d: "M -5 -45 L -30 -30 L -5 -15" } }
    ];
  }
  if (/right/.test(m)) {
    return [
      { tag: "path", attrs: { d: "M -30 20 L -30 -10 Q -30 -30 -10 -30 L 25 -30" } },
      { tag: "path", attrs: { d: "M 5 -45 L 30 -30 L 5 -15" } }
    ];
  }
  return [
    { tag: "path", attrs: { d: "M 0 25 L 0 -30" } },
    { tag: "path", attrs: { d: "M -18 -12 L 0 -34 L 18 -12" } }
  ];
}

function renderNavGauge(data) {
  navMainTextEl.textContent = data.mainText || "";
  navSubTextEl.textContent = data.subText || "";
  navDistTextEl.textContent = data.distText || "";

  while (navIconEl.firstChild) navIconEl.removeChild(navIconEl.firstChild);
  buildNavIconElements(data.maneuverType, data.maneuverModifier).forEach(({ tag, attrs }) => {
    navIconEl.appendChild(el(tag, attrs));
  });

  while (navLanesEl.firstChild) navLanesEl.removeChild(navLanesEl.firstChild);
  const lanes = data.lanes || [];
  if (lanes.length) {
    const boxW = 28, boxH = 40, gap = 6, boxY = 270;
    const totalW = lanes.length * boxW + (lanes.length - 1) * gap;
    const startX = 200 - totalW / 2 + boxW / 2;
    lanes.forEach((lane, i) => {
      const cx = startX + i * (boxW + gap);
      const stroke = lane.active ? NAV_BLUE : NAV_BLUE_DIM;
      navLanesEl.appendChild(el("rect", {
        x: cx - boxW / 2, y: boxY, width: boxW, height: boxH, rx: 3,
        fill: "none", stroke, "stroke-width": 1.4
      }));
      const dir = lane.direction || "straight";
      const shaftD = dir === "left" ? `M ${cx + 7} ${boxY + boxH - 6} L ${cx + 7} ${boxY + 10} Q ${cx + 7} ${boxY + 2} ${cx - 1} ${boxY + 2} L ${cx - 8} ${boxY + 2}`
                   : dir === "right" ? `M ${cx - 7} ${boxY + boxH - 6} L ${cx - 7} ${boxY + 10} Q ${cx - 7} ${boxY + 2} ${cx + 1} ${boxY + 2} L ${cx + 8} ${boxY + 2}`
                   : `M ${cx} ${boxY + boxH - 6} L ${cx} ${boxY + 6}`;
      const headD  = dir === "left" ? `M ${cx - 4} ${boxY - 4} L ${cx - 10} ${boxY + 2} L ${cx - 4} ${boxY + 8}`
                   : dir === "right" ? `M ${cx + 4} ${boxY - 4} L ${cx + 10} ${boxY + 2} L ${cx + 4} ${boxY + 8}`
                   : `M ${cx - 6} ${boxY + 14} L ${cx} ${boxY + 4} L ${cx + 6} ${boxY + 14}`;
      [shaftD, headD].forEach(d => {
        navLanesEl.appendChild(el("path", {
          d, fill: "none", stroke, "stroke-width": 3, "stroke-linecap": "round", "stroke-linejoin": "round"
        }));
      });
    });
  }
}
