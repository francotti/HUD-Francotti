/* ---------------------------------------------------------------------
   Map dial (Scherm 4, second dial): Mapbox Static Images API, north-up,
   centred on the current GPS fix, with a dark blue classic Citroen DS 23
   icon marking the car's own position, rotated to match the direction
   of travel. Prefers the GPS coords.heading (course-over-ground); if the
   device doesn't report one, falls back to the bearing between the last
   two fixes once the car has moved a few metres. */
const mapImageEl = document.getElementById("mapImage");
const mapCarIconEl = document.getElementById("mapCarIcon");
const mapPlaceholderEl = document.getElementById("mapPlaceholder");
const mapSpeedDigitsEl = document.getElementById("mapSpeedDigits");
const mapLimitFaceEl = document.getElementById("mapLimitFace");
const mapLimitGlowEl = document.getElementById("mapLimitGlow");
const mapLimitDigitsEl = document.getElementById("mapLimitDigits");
let lastCourse = null;
let lastMapFetch = 0;
const MAP_FETCH_INTERVAL_MS = 5000;
const MAP_ZOOM = 16;
// Same hand-drawn glyphs as the other signs — a bit smaller than the
// sign's very first size, per request. 3-digit limits (100+) get a
// further-reduced scale so they still fit the face comfortably.
const MAP_LIMIT_DIGIT_SCALE = 1.1;
const MAP_LIMIT_DIGIT_SCALE_WIDE = 0.85;
const MAP_LIMIT_SIGN_Y = 116; // matches #mapLimitSign's transform above
function mapLimitSignColors(kind) {
  if (kind === "unknown")  return { ring: "#ffb347", face: "url(#limitFaceMapY)" };
  if (kind === "infinite") return { ring: "#4a90e2", face: "url(#limitFaceMapB)" };
  return { ring: "#d63b3b", face: "url(#limitFaceMapR)" };
}

// Map dial's speed readout, hand-drawn GLYPH digits (same font as every
// other dial) instead of plain SVG text, per request. Same glow-layer
// pattern as renderSpeedWarnDigits()/frost's tiers: two normally-
// invisible blurred glow layers (yellow, red) whose CSS animation is
// toggled via a class on this group, then the crisp coloured digits on
// top — no outline layer (removed per request).
function renderMapSpeedDigits(text, tier) {
  while (mapSpeedDigitsEl.firstChild) mapSpeedDigitsEl.removeChild(mapSpeedDigitsEl.firstChild);
  const chars = text.split("");
  const offsets = [0];
  for (let k = 1; k < chars.length; k++) {
    const narrow = chars[k] === "1" || chars[k-1] === "1" || chars[k] === "-" || chars[k-1] === "-";
    offsets.push(offsets[k-1] + (narrow ? PITCH_NARROW : PITCH_WIDE));
  }
  const totalW = offsets[offsets.length - 1];
  function digitGroup(cls, color, strokeW, filterAttr) {
    const attrs = { class: cls };
    if (filterAttr) attrs.filter = filterAttr;
    const g = el("g", attrs);
    chars.forEach((ch, idx) => {
      const gx = offsets[idx] - totalW / 2;
      g.appendChild(el("path", {
        d: GLYPH[ch], fill: "none", stroke: color,
        "stroke-width": strokeW, "stroke-linecap": "round", "stroke-linejoin": "round",
        transform: `translate(${gx} 0)`
      }));
    });
    return g;
  }
  const crispColor = tier === "red" ? "#ff4d4d" : tier === "yellow" ? "#ffd83d" : "rgba(255,255,255,.92)";
  mapSpeedDigitsEl.appendChild(digitGroup("map-speed-glow-yellow", "#ffd83d", GLYPH_STROKE + 2.5, "url(#coldGlowM)"));
  mapSpeedDigitsEl.appendChild(digitGroup("map-speed-glow-red",    "#ff4d4d", GLYPH_STROKE + 2.5, "url(#coldGlowM)"));
  mapSpeedDigitsEl.appendChild(digitGroup("map-speed-crisp", crispColor, GLYPH_STROKE, null));
  mapSpeedDigitsEl.classList.toggle("yellow-glow", tier === "yellow");
  mapSpeedDigitsEl.classList.toggle("red-glow", tier === "red");
}

/* Keeps the map dial's own speed readout and mini limit-sign in sync
   with the main speedometer and limit-sign gauges.
   - speedOverride: pass the value pointSpeedTo() is actually driving the
     needle/digits with right now (real GPS or a test step) — pointSpeedTo()
     itself calls this on every update, which is what makes the map track
     TEST RUN/TEST LIMIT WARN too (those never touch lastSpeedKmh). When
     called with no argument (from applyLimitDisplay(), or once at boot),
     it falls back to lastSpeedKmh so a limit-only change doesn't blank
     the speed number.
   - The limit sign always reads limitKind/currentLimit directly, so it's
     current regardless of which caller triggered this.
   Wrapped in try/catch because at boot this can fire before
   lastSpeedKmh/currentLimit's own declarations have executed (same TDZ
   edge case as setScreen3's boot-time re-render). */
function updateMapSpeedInfo(speedOverride) {
  try {
    const src = typeof speedOverride === "number" ? speedOverride : lastSpeedKmh;
    const kmh = typeof src === "number" ? Math.round(src) : null;
    // Same tiers/thresholds as the main speedometer: 0-5 over the
    // current limit = bright yellow glow, >=5 over = bright red glow.
    const delta = (kmh !== null && typeof currentLimit === "number") ? kmh - currentLimit : null;
    const tier = delta === null || delta <= 0 ? "normal" : delta < 5 ? "yellow" : "red";
    renderMapSpeedDigits(kmh === null ? "--" : `${kmh}`, tier);
    const colors = mapLimitSignColors(limitKind);
    mapLimitFaceEl.setAttribute("fill", colors.face);
    mapLimitFaceEl.setAttribute("stroke", colors.ring);
    mapLimitGlowEl.setAttribute("fill", colors.ring);
    const limitText = limitTextFor(limitKind, currentLimit);
    const limitScale = limitText.length >= 3 ? MAP_LIMIT_DIGIT_SCALE_WIDE : MAP_LIMIT_DIGIT_SCALE;
    renderLimitDigitsInto(mapLimitDigitsEl, limitText, "#111", MAP_LIMIT_SIGN_Y, limitScale);
  } catch { /* referenced state not initialised yet — ignore, next call fixes it */ }
}

function bearingDeg(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
  const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
  const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
            Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function updateMapGauge(lat, lon, headingFromGps, prevPos) {
  if (typeof headingFromGps === "number" && !isNaN(headingFromGps)) {
    lastCourse = headingFromGps;
  } else if (prevPos) {
    const moved = haversineMeters(prevPos.lat, prevPos.lon, lat, lon);
    if (moved > 3) lastCourse = bearingDeg(prevPos.lat, prevPos.lon, lat, lon);
  }
  if (typeof lastCourse === "number") {
    mapCarIconEl.setAttribute("transform", `translate(200,200) rotate(${lastCourse})`);
    mapCarIconEl.setAttribute("display", "block");
  }
  const token = getMapboxToken();
  if (!token) {
    mapPlaceholderEl.textContent = "— EERST MAPBOX KEY INSTELLEN —";
    mapPlaceholderEl.style.display = "";
    return;
  }
  const now = Date.now();
  if (now - lastMapFetch < MAP_FETCH_INTERVAL_MS) return;
  lastMapFetch = now;
  const url = `https://api.mapbox.com/styles/v1/mapbox/dark-v11/static/${lon},${lat},${MAP_ZOOM},0/300x300@2x?access_token=${token}`;
  mapImageEl.setAttribute("href", url);
  mapPlaceholderEl.style.display = "none";
}

/* Default view shown before a real GPS fix arrives (or if it never
   does — permission denied, no signal, etc.): a bundled static
   overview map of the Netherlands (nl-default-map.png — a one-time
   Mapbox dark-v11 snapshot, pre-cropped to a circle) instead of a
   blank placeholder or a live API request. No Mapbox token or
   network call is needed for this default view; it's a local asset.
   Any later real fix from onPosition()/updateMapGauge() overwrites
   this with the live position and shows the direction marker on top
   — this only covers the "no GPS yet" gap. */
function showDefaultMap() {
  mapImageEl.setAttribute("href", "nl-default-map.png");
  mapPlaceholderEl.style.display = "none";
  mapCarIconEl.setAttribute("display", "none"); // no real fix yet — no position marker
}
showDefaultMap();
updateMapSpeedInfo();

/* =====================================================================
   FULLSCREEN + WAKE LOCK
   - 3s after load, request real Fullscreen on <html> (works on
     desktop/Android Chrome) AND hide the footer/controls so the dials
     fill the screen either way — iOS Safari has no Fullscreen API for
     regular pages, so the footer-hide is what actually delivers a
     "fullscreen" look there. Tap/touch anywhere brings the controls
     back for a few seconds, then they auto-hide again.
   - Wake Lock keeps the screen from dimming/locking while driving
     (supported iOS Safari 16.4+); re-acquired whenever the tab/app
     becomes visible again, since the OS releases it when backgrounded.
===================================================================== */
function enterFullscreenLook() {
  try {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el).catch?.(() => {});
  } catch { /* Fullscreen API unavailable (e.g. iOS Safari) — ignore */ }
  document.body.classList.add("footer-hidden");
}
let fullscreenHideTimer = null;
function scheduleFullscreenHide() {
  clearTimeout(fullscreenHideTimer);
  fullscreenHideTimer = setTimeout(enterFullscreenLook, 3000);
}
function showControlsBriefly() {
  document.body.classList.remove("footer-hidden");
  scheduleFullscreenHide();
}
document.addEventListener("click", showControlsBriefly);
document.addEventListener("touchstart", showControlsBriefly, { passive: true });
scheduleFullscreenHide(); // initial 3s-after-load hide; any tap resets this same timer

let wakeLock = null;
async function requestWakeLock() {
  if (!("wakeLock" in navigator)) return;
  if (wakeLock) return; // already holding one
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => {
      wakeLock = null;
      // A release can happen for reasons other than backgrounding —
      // some browsers silently drop it after a while even on a visible
      // page — so try to grab it straight back if we're still on screen.
      if (document.visibilityState === "visible") requestWakeLock();
    });
  } catch { /* e.g. Low Power Mode, or not allowed yet — silently skip */ }
}
requestWakeLock();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});
// Extra safety net for long drives: don't just rely on the release event
// firing reliably — periodically check/reacquire so the screen never
// ends up dimming mid-trip even after hours of use.
setInterval(() => {
  if (document.visibilityState === "visible") requestWakeLock();
}, 20000);
// The very first request above happens before any user interaction;
// some browsers only honour Wake Lock once a real gesture has occurred,
// so also grab it on the first tap as a fallback.
document.addEventListener("click", requestWakeLock, { once: true });
document.addEventListener("touchstart", requestWakeLock, { once: true, passive: true });

/* Boot */
pointSpeedTo(0);
setStatus("— HUD ACTIEF —");
</script>
</body>
</html>
